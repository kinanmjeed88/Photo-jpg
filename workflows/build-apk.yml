name: Build Android APK

on:
  push:
    branches:
      - main
      - feature/* # لدعم الفروع التي ينشئها Jules
  workflow_dispatch: # يتيح لك تشغيل عملية البناء يدوياً بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17' # متوافق مع متطلبات بيئة البناء الحديثة التي طلبناها

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean Workspace & Get Packages
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
