name: Format patch (temporary helper)

# TEMPORARY HELPER - removed as soon as the canonical formatting pass is in the
# branch being verified.
#
# Why it exists: the audit environment has no Dart SDK, so `dart format` and the
# `pubspec.lock` refresh that a real `flutter pub get` produces cannot be run
# locally. This job runs both in a real Flutter environment and commits the
# result to a throwaway branch (`arena/format-helper`). The result is reviewed
# and fast-forwarded into the working branch by hand; the repository keeps a
# single honest verification workflow (build_apk.yml) that never writes.
# `workflow_dispatch` cannot reach a workflow that is not on the default branch,
# so the job is triggered by a push to the branch under verification and gated on
# an explicit marker in the commit subject. Pushing without the marker is a no-op.
on:
  push:
    branches:
      - arena/01a10b57-photo-jpg

permissions:
  contents: write

jobs:
  format:
    name: Run pub get and dart format, publish to a scratch branch
    if: contains(github.event.head_commit.message, '[ci-format]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: arena/01a10b57-photo-jpg
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install packages (refreshes pubspec.lock)
        run: flutter pub get

      - name: Report resolved versions
        run: |
          flutter --version
          grep -c "^  cupertino_icons:\|^  permission_handler:\|^  riverpod_annotation:" pubspec.lock || echo "removed dependencies absent from pubspec.lock"

      - name: Apply canonical formatting
        run: dart format .

      - name: Publish the result to the scratch branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git --no-pager diff --cached --stat
          git commit -m "style: canonical dart formatting + refreshed pubspec.lock (CI helper)" || echo "nothing to commit"
          git push --force origin HEAD:refs/heads/arena/format-helper
