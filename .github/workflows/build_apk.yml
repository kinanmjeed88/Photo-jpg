name: Build & Verify Android

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the repository. It never pushes.
# Automated commits from a build machine are intentionally not part of CI:
# every change must be reviewed by a human before it reaches a branch.
permissions:
  contents: read

jobs:
  verify:
    name: Analyze, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Verify formatting
        # Canonical formatting is part of the gate: a diff here means the file
        # would be rewritten by `dart format`, so the fix is to format the
        # source rather than to skip the check.
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Build release APK
        env:
          # Optional: configure these secrets to sign a distributable build.
          # Without them Gradle falls back to the debug key and the warning is
          # visible in the log.
          PHOTOJPG_STORE_FILE: ${{ secrets.PHOTOJPG_STORE_FILE }}
          PHOTOJPG_STORE_PASSWORD: ${{ secrets.PHOTOJPG_STORE_PASSWORD }}
          PHOTOJPG_KEY_ALIAS: ${{ secrets.PHOTOJPG_KEY_ALIAS }}
          PHOTOJPG_KEY_PASSWORD: ${{ secrets.PHOTOJPG_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK artifact
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
